name: Normalize staging site
on:
  push:
    paths:
      - '.github/workflows/normalize-footer.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize square footer brand in HTML
        shell: python
        run: |
          from pathlib import Path
          import re

          footer = '<footer class="site-footer"><div class="wrap footer-grid"><div class="footer-brand-column"><a class="footer-brand-lockup" href="" aria-label="Mi Terapia Regresiva, inicio"><img class="footer-brand-symbol" src="assets/images/branding/mi-terapia-regresiva-simbolo.svg" alt="" width="180" height="180" loading="lazy"><span class="footer-brand-domain"><strong>miterapiaregresiva</strong><span class="domain-tld">.com</span></span><span class="footer-brand-tagline">Explora tu historia. Comprende tu presente.</span><span class="footer-brand-service">Terapia regresiva en Tenerife</span></a></div><nav aria-label="Enlaces del sitio"><a href="terapia-regresiva/">Terapia regresiva</a><a href="como-trabajo/">Cómo trabajo</a><a href="sobre-mi/">Sobre mí</a><a href="articulos/">Artículos</a><a href="contacto/">Contacto</a></nav><nav aria-label="Recursos y legal"><a href="biblioteca-de-terapia-regresiva/">Biblioteca</a><a href="preguntas-frecuentes/">Preguntas frecuentes</a><a href="politica-de-privacidad/">Política de privacidad</a><a href="licencias-de-recursos/">Licencias de recursos</a><a href="https://www.instagram.com/miterapiaregresiva/" target="_blank" rel="noopener noreferrer" aria-label="Instagram de Mi Terapia Regresiva, abre en una pestaña nueva">Instagram · @miterapiaregresiva</a></nav></div><div class="wrap footer-legal"><p>© 2023–2026 Mi Terapia Regresiva · Código bajo <a href="https://github.com/miterapiaregresiva/miterapiaregresiva.github.io/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">GNU AGPL v3.0</a> · Desarrollo web: <a href="https://gofiodesign.eu/" target="_blank" rel="noopener noreferrer">Gofio Design</a></p></div></footer>'

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = text.replace('<base href="/mtr/">', '<base href="/">')
              new = new.replace('https://miterapiaregresiva.com/mtr/', 'https://stg.miterapiaregresiva.com/')
              new, count = re.subn(r'<footer class="site-footer">.*?</footer>', footer, new, count=1, flags=re.S)
              if count and new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          css_path = Path('assets/brand-lockup.css')
          original_css = css_path.read_text(encoding='utf-8')
          marker_start = '/* square-footer-brand:start */'
          marker_end = '/* square-footer-brand:end */'
          css_block = '/* square-footer-brand:start */\n.footer-brand-column{display:flex;justify-content:flex-start}.footer-brand-lockup{width:min(100%,330px);display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:var(--text);line-height:1.1}.footer-brand-symbol{width:clamp(118px,13vw,170px);height:auto;aspect-ratio:1;object-fit:contain;margin:0 auto .8rem}.footer-brand-domain{display:block;white-space:nowrap;font-size:clamp(1.28rem,2vw,1.75rem);letter-spacing:-.045em}.footer-brand-domain strong{font-weight:720}.footer-brand-domain .domain-tld{font-weight:300;color:#514b52}.footer-brand-tagline{display:block;margin-top:.7rem;font-size:.72rem;font-weight:400;letter-spacing:.095em;color:#3f393f}.footer-brand-service{width:min(100%,285px);display:flex;align-items:center;gap:.65rem;margin-top:1rem;white-space:nowrap;font-size:.62rem;font-weight:450;letter-spacing:.17em;color:#514b52}.footer-brand-service::before,.footer-brand-service::after{content:"";height:1px;flex:1 1 3rem;background:currentColor;opacity:.55}.footer-brand-service::before{box-shadow:calc(100% + .325rem) 0 0 -0.5px currentColor}.footer-brand-lockup:hover .footer-brand-domain strong{color:var(--accent-strong)}.footer-legal{margin-top:2rem;padding-top:1.25rem;border-top:1px solid var(--line);font-size:.84rem}.footer-legal p{margin:0}@media(max-width:900px){.footer-brand-column{grid-column:1/-1}.footer-brand-lockup{margin-inline:auto}}@media(max-width:520px){.footer-brand-domain{font-size:1.22rem}.footer-brand-tagline{font-size:.68rem;letter-spacing:.055em}.footer-brand-service{font-size:.57rem;letter-spacing:.1em;white-space:normal}.footer-brand-service::before,.footer-brand-service::after{display:none}}\n/* square-footer-brand:end */'
          css = re.sub(re.escape(marker_start) + r'.*?' + re.escape(marker_end), '', original_css, flags=re.S).rstrip() + '\n' + css_block + '\n'
          if css != original_css:
              css_path.write_text(css, encoding='utf-8')
              changed.append(str(css_path))

          site_js = Path('assets/site.js')
          text = site_js.read_text(encoding='utf-8')
          new = text.replace('https://github.com/miterapiaregresiva/stg/blob/main/LICENSE', 'https://github.com/miterapiaregresiva/miterapiaregresiva.github.io/blob/main/LICENSE')
          if new != text:
              site_js.write_text(new, encoding='utf-8')
              changed.append(str(site_js))

          print(f'Updated {len(changed)} files')
          for path in changed:
              print(path)
      - name: Commit normalized staging site
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Materialize square footer brand in HTML"
          git pull --rebase origin main
          git push