name: Convert images to WebP

on:
  push:
    paths:
      - '.github/workflows/convert-images-webp.yml'
      - 'assets/images/original/**/*.jpg'
      - 'assets/images/original/**/*.jpeg'
      - 'assets/images/original/**/*.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert images
        run: |
          mkdir -p assets/images/webp
          find assets/images/original -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0 | while IFS= read -r -d '' file; do
            rel="${file#assets/images/original/}"
            out="assets/images/webp/${rel%.*}.webp"
            mkdir -p "$(dirname "$out")"
            case "$file" in
              *.png|*.PNG) cwebp -quiet -lossless "$file" -o "$out" ;;
              *) cwebp -quiet -q 82 "$file" -o "$out" ;;
            esac
          done

      - name: Commit generated WebP files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/webp
          if git diff --cached --quiet; then
            echo 'No WebP changes to commit.'
          else
            git commit -m 'Optimize images: generate WebP versions'
            git push
          fi
