name: Bump desktop header CSS version

on:
  push:
    paths:
      - '.github/workflows/bump-mobile-assets.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump brand lockup CSS version in HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = 0
          for p in Path('.').rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              updated = re.sub(r'assets/brand-lockup\.css(?:\?v=[^"\']*)?', 'assets/brand-lockup.css?v=20260914-8', text)
              if updated != text:
                  p.write_text(updated, encoding='utf-8')
                  changed += 1
          print(f'Updated {changed} HTML files')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "gofio-design"
          git config user.email "gofio.design@gmail.com"
          find . -name '*.html' -print0 | xargs -0 git add
          git commit -m "Bust desktop header CSS cache"
          git push
