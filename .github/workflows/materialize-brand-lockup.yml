name: Materialize brand lockup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-brand-lockup.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize and validate headers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          brand = ('<a class="brand brand-lockup" href="" aria-label="Mi Terapia Regresiva, inicio">'
                   '<img class="brand-symbol" src="assets/images/branding/mi-terapia-regresiva-simbolo.svg" alt="" width="68" height="68">'
                   '<span class="brand-copy">'
                   '<span class="brand-domain"><strong>miterapiaregresiva</strong><span class="domain-tld">.com</span></span>'
                   '<span class="brand-tagline">Explora tu historia. Comprende tu presente.</span>'
                   '<span class="brand-service">Terapia regresiva en Tenerife</span>'
                   '</span></a>')
          anchor = re.compile(r'<a\s+class="brand(?:\s+brand-lockup)?"\s+href="(?:\./)?"(?:\s+aria-label="[^"]*")?>.*?</a>', re.S)
          headers = changed = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'site-header' not in text:
                  continue
              headers += 1
              new, count = anchor.subn(brand, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected one brand anchor, found {count}')
              if 'assets/brand-lockup.css' not in new:
                  marker = '<link rel="stylesheet" href="assets/styles.css">'
                  if marker not in new:
                      raise SystemExit(f'{path}: styles.css marker missing')
                  new = new.replace(marker, marker + '<link rel="stylesheet" href="assets/brand-lockup.css">', 1)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1

          js_path = Path('assets/site.js')
          lines = js_path.read_text(encoding='utf-8').splitlines()
          lines = [line for line in lines if 'link[href="assets/brand-lockup.css"]' not in line and "querySelectorAll('.site-header .brand')" not in line]
          js = '\n'.join(lines) + '\n'
          if 'brand.innerHTML' in js or "querySelectorAll('.site-header .brand')" in js:
              raise SystemExit('assets/site.js still builds the header brand')
          js_path.write_text(js, encoding='utf-8')

          if not headers:
              raise SystemExit('No page headers found')
          problems = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'site-header' not in text:
                  continue
              if text.count('class="brand brand-lockup"') != 1:
                  problems.append(f'{path}: static lockup missing or duplicated')
              for required in ('class="brand-copy"', 'miterapiaregresiva</strong><span class="domain-tld">.com', 'Explora tu historia. Comprende tu presente.', 'Terapia regresiva en Tenerife', 'assets/brand-lockup.css'):
                  if required not in text:
                      problems.append(f'{path}: missing {required}')
          if problems:
              raise SystemExit('\n'.join(problems))
          print(f'Validated {headers} static HTML headers; changed {changed} files.')
          PY
      - name: Commit static headers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize brand lockup in all HTML headers'
          git push origin main
